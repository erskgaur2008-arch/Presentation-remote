name: Build ER SK GAUR Presentation Remote
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: er-sk-gaur-android-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows receiver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows receiver
        run: dotnet publish "windows/ERSKGaurRemoteReceiver.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Package receiver
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ER-SK-GAUR-Windows-Receiver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: er-sk-gaur-windows-receiver
          path: ER-SK-GAUR-Windows-Receiver.zip
          if-no-files-found: error
